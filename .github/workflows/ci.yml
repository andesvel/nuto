name: CI

# Quality gate for the implementation branch. Feature branches are checked on
# their PR to dev; pushes to dev (the merge commits) are checked too, because
# that is the commit a dev -> main PR carries and deploy.yml verifies.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs can be dropped; dev runs must finish so every dev
  # commit that may reach main has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.14.0

jobs:
  quality:
    # deploy.yml and the branch protection rules look this check up by name
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static Analysis
        run: pnpm exec eslint .

      - name: Typecheck
        run: pnpm run typecheck

      - name: Integration & Unit Tests
        run: pnpm vitest run
